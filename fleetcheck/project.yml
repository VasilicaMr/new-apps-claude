name: FleetCheck

options:
  bundleIdPrefix: com.adaptiveservices
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: J5WZTVZJ44
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES

targets:
  FleetCheck:
    type: application
    platform: iOS
    sources:
      - path: FleetCheck
      - path: Shared
    dependencies:
      - target: FleetCheckWidgets
    info:
      path: FleetCheck/App/Info.plist
      properties:
        CFBundleDisplayName: FleetCheck
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: "FleetCheck uses your location during a shift to count the kilometers and time you drive. Your route is stored only on this iPhone."
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptiveservices.fleetcheck
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - FleetCheckTests

  FleetCheckWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FleetCheckWidgets
      - path: Shared
    info:
      path: FleetCheckWidgets/Info.plist
      properties:
        CFBundleDisplayName: FleetCheck
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptiveservices.fleetcheck.widgets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  FleetCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FleetCheckTests
    dependencies:
      - target: FleetCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptiveservices.fleetcheck.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FleetCheck.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FleetCheck"
        BUNDLE_LOADER: "$(TEST_HOST)"
