name: FleetCheck

options:
  bundleIdPrefix: com.adaptiveservices
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: J5WZTVZJ44
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  FleetCheck:
    type: application
    platform: iOS
    sources:
      - path: FleetCheck
      - path: Shared
    dependencies:
      - target: FleetCheckWidgets
    info:
      path: FleetCheck/App/Info.plist
      properties:
        CFBundleDisplayName: DriveCap
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.finance
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        NSPhotoLibraryUsageDescription: "DriveCap finds the earnings screenshots you take in Uber or Bolt and reads them on this iPhone, so you don't have to type the numbers. Images are never stored or sent."
        NSCameraUsageDescription: "Take a photo of a receipt and DriveCap fills in the expense for you."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptiveservices.drivo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - FleetCheckTests
      # Local products for the simulator; the real ones live in App Store Connect.
      storeKitConfiguration: FleetCheck.storekit

  FleetCheckWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FleetCheckWidgets
      - path: Shared
    info:
      path: FleetCheckWidgets/Info.plist
      properties:
        CFBundleDisplayName: DriveCap
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptiveservices.drivo.widgets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  FleetCheckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FleetCheckTests
      - path: FleetCheck.storekit
        buildPhase: resources
    dependencies:
      - target: FleetCheck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptiveservices.drivo.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FleetCheck.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FleetCheck"
        BUNDLE_LOADER: "$(TEST_HOST)"
