name: ScoreCap

options:
  bundleIdPrefix: com.yourapp
  deploymentTarget:
    iOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "16.4"
  generateEmptyDirectories: false
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_PREVIEWS: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

configs:
  Debug: debug
  Release: release

targets:

  # ─────────────────────────────────────────
  # Main App
  # ─────────────────────────────────────────
  ScoreCap:
    type: application
    platform: iOS
    deploymentTarget: "26.0"

    sources:
      - path: App
        createIntermediateGroups: true
      - path: Core
        createIntermediateGroups: true
      - path: Data
        createIntermediateGroups: true
      - path: Domain
        createIntermediateGroups: true
      - path: Presentation
        createIntermediateGroups: true
      - path: Resources
        createIntermediateGroups: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourapp.sportscore
        PRODUCT_NAME: ScoreCap
        INFOPLIST_KEY_CFBundleDisplayName: ScoreCap
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: J5WZTVZJ44
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          VALIDATE_PRODUCT: YES

    entitlements:
      path: Entitlements/ScoreCap.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourapp.sportscore

    dependencies:
      - target: ScoreCapWidgetExtension
        embed: true

  # ─────────────────────────────────────────
  # Widget Extension
  # ─────────────────────────────────────────
  ScoreCapWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"

    sources:
      - path: WidgetExtension
        createIntermediateGroups: true

    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: ScoreCap
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourapp.sportscore.widget
        PRODUCT_NAME: ScoreCapWidgetExtension
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: J5WZTVZJ44
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          VALIDATE_PRODUCT: YES

    entitlements:
      path: Entitlements/ScoreCapWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourapp.sportscore

  # ─────────────────────────────────────────
  # Apple TV App
  # Shares Domain, Data, Core and the view models with iOS;
  # only the presentation layer (TV/) is tvOS-specific.
  # Same bundle ID as iOS so ScoreCap ships as a universal purchase
  # (one App Store listing, Premium unlocks on both).
  # ─────────────────────────────────────────
  ScoreCapTV:
    type: application
    platform: tvOS
    deploymentTarget: "26.0"

    sources:
      - path: TV
        createIntermediateGroups: true
      - path: Domain
        createIntermediateGroups: true
      - path: Core
        createIntermediateGroups: true
      - path: Data
        createIntermediateGroups: true
        excludes:
          - "Persistence/SharedStore.swift"
      - path: App
        createIntermediateGroups: true
        includes:
          - "AppContainer.swift"
          - "PremiumManager.swift"
      - path: Presentation
        createIntermediateGroups: true
        includes:
          - "**/*ViewModel.swift"
          - "Session/ScoreEntryViews/QuickScorePresets.swift"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourapp.sportscore
        PRODUCT_NAME: ScoreCap
        INFOPLIST_KEY_CFBundleDisplayName: ScoreCap
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        TVOS_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        "DEVELOPMENT_TEAM[sdk=appletvos*]": J5WZTVZJ44
        "CODE_SIGN_IDENTITY[sdk=appletvos*]": iPhone Distribution
        PROVISIONING_PROFILE_SPECIFIER: ""
        "PROVISIONING_PROFILE_SPECIFIER[sdk=appletvos*]": prov-profile-scorecap-tvos
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          VALIDATE_PRODUCT: YES

    entitlements:
      path: Entitlements/ScoreCapTV.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourapp.sportscore

  # ─────────────────────────────────────────
  # Apple TV UI tests (Siri Remote focus navigation)
  # ─────────────────────────────────────────
  ScoreCapTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "26.0"

    sources:
      - path: TVUITests
        createIntermediateGroups: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourapp.sportscore.tvuitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: J5WZTVZJ44
        TEST_TARGET_NAME: ScoreCapTV
        # XCUITest APIs are main-thread only and not yet annotated for Swift 6.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal

    dependencies:
      - target: ScoreCapTV

schemes:

  # ─────────────────────────────────────────
  # Main App — Debug
  # ─────────────────────────────────────────
  ScoreCap:
    build:
      targets:
        ScoreCap: all
        ScoreCapWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # ─────────────────────────────────────────
  # Release / Archive
  # ─────────────────────────────────────────
  ScoreCap-Release:
    build:
      targets:
        ScoreCap: all
        ScoreCapWidgetExtension: all
    run:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release

  # ─────────────────────────────────────────
  # Apple TV
  # ─────────────────────────────────────────
  ScoreCapTV:
    build:
      targets:
        ScoreCapTV: all
    run:
      config: Debug
      storeKitConfiguration: ScoreCap.storekit
    test:
      config: Debug
      targets:
        - ScoreCapTVUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
