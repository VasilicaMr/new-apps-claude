name: SportScore

options:
  bundleIdPrefix: com.yourapp
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "16.4"
  generateEmptyDirectories: false
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_PREVIEWS: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

configs:
  Debug: debug
  Release: release

targets:

  # ─────────────────────────────────────────
  # Main App
  # ─────────────────────────────────────────
  SportScore:
    type: application
    platform: iOS
    deploymentTarget: "26.0"

    sources:
      - path: App
        createIntermediateGroups: true
      - path: Core
        createIntermediateGroups: true
      - path: Data
        createIntermediateGroups: true
      - path: Domain
        createIntermediateGroups: true
      - path: Presentation
        createIntermediateGroups: true
      - path: Resources
        createIntermediateGroups: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourapp.sportscore
        PRODUCT_NAME: SportScore
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: J5WZTVZJ44
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          VALIDATE_PRODUCT: YES

    entitlements:
      path: Entitlements/SportScore.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourapp.sportscore

    dependencies:
      - target: SportScoreWidgetExtension
        embed: true

  # ─────────────────────────────────────────
  # Widget Extension
  # ─────────────────────────────────────────
  SportScoreWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"

    sources:
      - path: WidgetExtension
        createIntermediateGroups: true

    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: SportScore
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourapp.sportscore.widget
        PRODUCT_NAME: SportScoreWidgetExtension
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: J5WZTVZJ44
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          VALIDATE_PRODUCT: YES

    entitlements:
      path: Entitlements/SportScoreWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourapp.sportscore

schemes:

  # ─────────────────────────────────────────
  # Main App — Debug
  # ─────────────────────────────────────────
  SportScore:
    build:
      targets:
        SportScore: all
        SportScoreWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # ─────────────────────────────────────────
  # Release / Archive
  # ─────────────────────────────────────────
  SportScore-Release:
    build:
      targets:
        SportScore: all
        SportScoreWidgetExtension: all
    run:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
