name: UniversalCap
options:
  bundleIdPrefix: com.universalcap
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: YES

targets:
  UniversalCap:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UniversalCap
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universalcap.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: UniversalCap
        INFOPLIST_KEY_NSSiriUsageDescription: UniversalCap uses Siri so you can capture thoughts, expenses, and tasks with your voice without opening the app.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: UniversalCap/UniversalCap.entitlements
      properties:
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.universalcap.app

  UniversalCapUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UniversalCapUITests
    dependencies:
      - target: UniversalCap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.universalcap.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: ""

schemes:
  UniversalCap:
    build:
      targets:
        UniversalCap: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UniversalCapUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
