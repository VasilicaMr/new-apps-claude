# Regenerate the Xcode project after adding/removing files:  cd ShadowMatch && xcodegen
name: ShadowMatch
options:
  bundleIdPrefix: com.adaptiveservices
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ShadowMatch:
    type: application
    platform: iOS
    sources:
      - path: ShadowMatch
    entitlements:
      path: ShadowMatch/ShadowMatch.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: ShadowMatch/Info.plist
      properties:
        CFBundleDisplayName: Peekaboo Shapes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptiveservices.shadowmatch
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  ShadowMatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ShadowMatchUITests
    dependencies:
      - target: ShadowMatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptiveservices.shadowmatch.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ShadowMatch:
    build:
      targets:
        ShadowMatch: all
        ShadowMatchUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: ShadowMatch.storekit
    test:
      config: Debug
      targets:
        - ShadowMatchUITests
    archive:
      config: Release
