# Regenerate the Xcode project after adding/removing files:  cd LittlePhysicsTrail && xcodegen
name: LittlePhysicsTrail
options:
  bundleIdPrefix: com.adaptiveservices
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  PhysicsTrailCore:
    path: Packages/PhysicsTrailCore
targets:
  LittlePhysicsTrail:
    type: application
    platform: iOS
    sources:
      - path: LittlePhysicsTrail
    dependencies:
      - package: PhysicsTrailCore
        product: TrailDomain
      - package: PhysicsTrailCore
        product: TrailData
    info:
      path: LittlePhysicsTrail/Info.plist
      properties:
        CFBundleDisplayName: Physics Trail   # home-screen label (full name truncates); App Store name: Little Physics Trail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptiveservices.littlephysicstrail
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  LittlePhysicsTrailUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LittlePhysicsTrailUITests
    dependencies:
      - target: LittlePhysicsTrail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adaptiveservices.littlephysicstrail.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LittlePhysicsTrail:
    build:
      targets:
        LittlePhysicsTrail: all
        LittlePhysicsTrailUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: LittlePhysicsTrail.storekit
    test:
      config: Debug
      targets:
        - LittlePhysicsTrailUITests
        - package: PhysicsTrailCore/TrailDomainTests
        - package: PhysicsTrailCore/TrailDataTests
    archive:
      config: Release
